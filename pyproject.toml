[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-chain-io-network-workflow"
version = "0.1.0.dev0"
description = "Reusable input-output and directed production-network research foundations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "networkx>=3.2,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1,<2"]
research = ["pandas>=2.2,<3", "statsmodels>=0.14,<0.15"]

[project.scripts]
ionet = "ionet.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["ionet"]
branch = true

