name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Run core tests and report coverage
        run: python -m pytest --cov=ionet --cov-report=term-missing
  research-cases:
    name: Research / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research dependencies
        run: python -m pip install -e ".[research]"
      - name: Check research syntax
        run: python -m compileall -q research
      - name: Structure-resilience model tests
        run: python research/structure_resilience/test_model.py
      - name: Critical-sector model tests
        run: python research/critical_sectors/test_model.py
      - name: Portable runner and synthetic examples
        run: python research/test_runner.py
      - name: Snapshot hashes and extracted code bundles
        run: python research/test_distribution.py
